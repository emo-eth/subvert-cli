name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use the package npm version
        run: npm install --global npm@11.11.0
      - name: Set package version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "Release tag must start with v: ${RELEASE_TAG}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          npm version "${version}" --no-git-tag-version --allow-same-version
          if [[ "$(node --print "require('./package.json').version")" != "${version}" ]]; then
            echo "Package version does not match release tag ${RELEASE_TAG}." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          package=$(node --print "require('./package.json').name")
          version=$(node --print "require('./package.json').version")
          set +e
          output=$(npm view "${package}@${version}" version 2>&1)
          status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            echo "${package}@${version} is already published; skipping npm publish."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          elif grep -q "E404" <<< "${output}"; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "${output}" >&2
            exit "${status}"
          fi
      - name: Publish to npm
        if: steps.npm-version.outputs.publish == 'true'
        run: npm publish --access public
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; keeping it."
          else
            gh release create "${RELEASE_TAG}" --generate-notes --verify-tag
          fi
